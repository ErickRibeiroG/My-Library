{% if messages %}
<div class="toasts" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="toast toast--{{ message.tags|default:'info' }}" data-toast>
        <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% elif message.tags == 'error' %}fa-circle-exclamation{% elif message.tags == 'warning' %}fa-triangle-exclamation{% else %}fa-circle-info{% endif %}" aria-hidden="true"></i>
        <span>{{ message }}</span>
        <button type="button" class="toast__fechar" data-toast-fechar aria-label="Fechar">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
